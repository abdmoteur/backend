<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABDmoteur</title>
<!--OG-->
<style>
:root{--red:#d7191f;--red2:#ff3b41;--bg:#0e1012;--steel:#181b1f;--steel2:#22262b;--line:#2f343a;--chrome:#eceef0;--mut:#9aa1a8;--green:#22a559}
*{box-sizing:border-box;margin:0}
body{font-family:'Segoe UI',system-ui,Tahoma,Arial,sans-serif;background:var(--bg) repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px);color:var(--chrome);min-height:100vh}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
header{background:rgba(10,11,12,.93);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;box-shadow:0 2px 0 var(--red)}
.bar{max-width:1140px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-end:auto}
.mini{width:34px;height:34px;border-radius:50%;border:3px solid #eee;background:radial-gradient(circle,var(--red) 0 16%,transparent 17%),repeating-conic-gradient(#cfd3d7 0 4deg,#1a1c1f 4deg 20deg)}
.word{font-size:26px;font-weight:900;font-style:italic;letter-spacing:.5px;display:inline-block;transform:skewX(-6deg)}
.word b{color:var(--red);-webkit-text-stroke:1px #fff;paint-order:stroke fill}
.word span{color:#fff}
.btn{background:linear-gradient(var(--red2),var(--red));border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:700;color:#fff;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:transparent;border:1px solid var(--line)}
.btn.ok{background:var(--green)}
.btn.sm{padding:6px 11px;font-size:13px}
select,input,textarea{background:var(--steel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.bar select{width:auto}
main{max-width:1140px;margin:auto;padding:22px 18px 70px}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#171a1e,#0a0b0c);border:1px solid var(--line);border-radius:18px;padding:34px;margin-bottom:24px;display:grid;grid-template-columns:1.4fr .6fr;gap:20px;align-items:center}
.hero h1.word{font-size:clamp(42px,8vw,76px);line-height:1}
.hero .sub{color:var(--mut);margin-top:10px;max-width:46ch}
.find{margin-top:22px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.find h2{grid-column:1/-1;font-size:16px}.find input{grid-column:1/-1}
.wheel{width:min(320px,100%);aspect-ratio:1;justify-self:center;border-radius:50%;border:14px solid #f1f1f1;box-shadow:0 0 0 8px #000,0 24px 50px #000a;
 background:radial-gradient(circle,var(--red) 0 7%,#111 7.5% 11%,transparent 11.5%),repeating-conic-gradient(#cfd3d7 0 1.2deg,transparent 1.2deg 9deg),radial-gradient(circle,#1b1d20 0 62%,#050505 63%);animation:spin 45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.wheel{animation:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--steel);border:1px solid var(--line);border-radius:20px;padding:6px 15px;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red)}
.cnt{color:var(--mut);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.prod{background:var(--steel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.prod:hover{border-color:var(--red)}
.pic{display:block}
.pic img,.noimg{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--steel2);display:block}
.prod>div{padding:13px;display:flex;flex-direction:column;gap:9px;flex:1;justify-content:space-between}
.pname{font-weight:700;text-decoration:none;line-height:1.35}
.price{font-weight:800;font-size:18px}.price em{color:var(--red2);font-style:normal;font-size:14px}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{background:var(--steel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--mut)}
.tag.u{background:var(--red);border-color:var(--red);color:#fff}.tag.x{cursor:pointer;color:var(--chrome)}
.panel{background:var(--steel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.form{display:grid;gap:12px;max-width:560px}
label{display:grid;gap:5px;color:var(--mut);font-size:14px}
.fs{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}.fs legend{padding:0 6px;color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.pp img,.pp .noimg{width:100%;border-radius:14px;aspect-ratio:1;object-fit:cover}
.pp h1{font-size:clamp(24px,4vw,34px);margin-bottom:10px}.pp ul{padding-inline-start:20px;color:var(--mut);margin:6px 0 14px}
.pp .price{font-size:28px;display:block;margin:10px 0}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--steel);border-radius:12px;padding:14px;border:1px solid var(--line);border-top:3px solid var(--red)}
.stat b{display:block;font-size:24px}.stat span{color:var(--mut);font-size:13px}
.bars div{display:grid;grid-template-columns:110px 1fr 80px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bars i{display:block;height:12px;background:var(--red);border-radius:3px}
.msg{padding:12px;border-radius:8px;background:#4a1f1f;margin-bottom:12px}
.empty{color:var(--mut);padding:30px;text-align:center}
.day{margin:22px 0 10px;background:#000;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between}
.day span{color:var(--mut);font-weight:400}
.order{border-radius:12px;padding:14px;margin-bottom:10px;border-inline-start:8px solid;display:grid;gap:8px}
.order.new{border-color:#e02424;background:#3d2222}.order.done{border-color:var(--green);background:#1f3a29}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700}
.new .badge{background:#e02424}.done .badge{background:var(--green)}
.st{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;color:#fff}
.st.in{background:var(--green)}.st.out{background:#e02424}
button.st{border:0;cursor:pointer;font-size:13px;padding:5px 12px}
.prod.off .pic img,.prod.off .noimg{filter:grayscale(.9) opacity(.55)}
.btn:disabled{background:#3a3e44;color:var(--mut);cursor:not-allowed}
.pic{position:relative}
.ph{position:absolute;bottom:8px;inset-inline-end:8px;background:rgba(0,0,0,.7);padding:2px 9px;border-radius:10px;font-size:12px}
.pp>div{min-width:0}
.gal{position:relative;overflow:hidden;border-radius:14px;background:var(--steel2);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.gal:active{cursor:grabbing}
.gt{display:flex;will-change:transform}
.gs{flex:0 0 100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.gal img{width:100%;height:100%;object-fit:contain;aspect-ratio:auto;border-radius:0;pointer-events:none}
.ga{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:24px;cursor:pointer;line-height:1;padding:0}
.ga.l{left:8px}.ga.r{right:8px}
.gd{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.gd i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4)}.gd i.on{background:var(--red2)}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.thumbs img{width:64px;height:64px;object-fit:cover;aspect-ratio:auto;border-radius:8px;border:2px solid var(--line);cursor:pointer;flex:none}
.thumbs img.on{border-color:var(--red)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:50;display:flex;align-items:center;justify-content:center}
.lb .gal{width:min(900px,96vw);background:transparent}
.lb .gs{aspect-ratio:auto;height:82vh}
.lx{position:absolute;top:14px;inset-inline-end:14px;background:rgba(0,0,0,.7);border:1px solid var(--line);color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;z-index:2}
.thumbsA{display:flex;gap:8px;flex-wrap:wrap}
.ath{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:2px solid var(--line)}
.ath.main{border-color:var(--red)}
.ath img{width:100%;height:100%;object-fit:cover;display:block}
.ath button{position:absolute;top:3px;background:rgba(0,0,0,.75);border:0;color:#fff;border-radius:5px;width:24px;height:24px;cursor:pointer;font-size:12px;padding:0}
.ath button[data-rx],.ath button[data-nx]{inset-inline-end:3px}.ath button[data-m]{inset-inline-start:3px}
.ft-in{max-width:1140px;margin:0 auto;padding:24px 18px 40px;border-top:2px solid var(--red);text-align:center}
.ft-in h3{margin-bottom:14px}
.ft-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ft-links a{display:inline-flex;align-items:center;gap:10px;background:var(--steel);border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-decoration:none;font-weight:700;color:#fff;transition:transform .15s,filter .15s}
.ft-links a:hover{transform:translateY(-2px);filter:brightness(1.12)}
.ft-links a.wa{background:#25D366;border-color:#25D366}
.ft-links a.fbk{background:#1877F2;border-color:#1877F2}
.ft-links a.tk{background:#000;border-color:#3a3f46}
.ft-links a.tel{background:var(--red);border-color:var(--red)}
.ft-links .ic svg{width:24px;height:24px;display:block}
.ft-addr{color:var(--mut);margin-top:14px}
.ft-cp{color:var(--mut);font-size:13px;margin-top:14px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:22px}.wheel{display:none}.pp{grid-template-columns:1fr}.bars div{grid-template-columns:80px 1fr 64px}}
</style>
</head>

/* ---------- Shared product bits ---------- */
const brandsOf = p => [...new Set((p.compat || []).map(c => c.brand))];
const tagsOf = p => {
  const b = brandsOf(p);
  return (p.universal ? `<span class="tag u">${t('univ')}</span>` : '') + b.slice(0, 3).map(x => `<span class="tag">${esc(x)}</span>`).join('') + (b.length > 3 ? `<span class="tag">+${b.length - 3}</span>` : '');
};

const stockTag = p => `<span class="st ${p.available === false ? 'out' : 'in'}">${p.available === false ? t('outstock') : t('instock')}</span>`;

const imgsOf = p => p.images && p.images.length ? p.images : (p.image ? [p.image] : []);
const cdn = (u, w) => u.includes('/upload/') ? u.replace('/upload/', `/upload/f_auto,q_auto,w_${w}/`) : u;
// Shrink a photo in the browser before upload: max 1400px, JPEG 82%
const shrink = file => new Promise(ok => {
  const img = new Image(), u = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u); c.toBlob(b => ok(b), 'image/jpeg', 0.82);
  };
  img.onerror = () => { URL.revokeObjectURL(u); ok(null); };
  img.src = u;
});
// Swipeable / draggable gallery. Returns go(index). Fires a 'slide' event on the box.
function gallery(box, imgs, i = 0, onTap = null, w = 1000) {
  let x0 = 0, dx = 0, drag = false, moved = false;
  box.innerHTML = `<div class="gt">${imgs.map(u => `<div class="gs"><img src="${esc(cdn(u, w))}" alt="" draggable="false"></div>`).join('')}</div>` +
    (imgs.length > 1 ? `<button class="ga l" type="button" aria-label="previous">‹</button><button class="ga r" type="button" aria-label="next">›</button><div class="gd">${imgs.map(() => '<i></i>').join('')}</div>` : '');
  const tr = box.querySelector('.gt'), dots = box.querySelectorAll('.gd i');
  const go = k => {
    i = Math.max(0, Math.min(imgs.length - 1, k));
    tr.style.transition = 'transform .25s'; tr.style.transform = `translateX(${-i * 100}%)`;
    dots.forEach((d, n) => d.classList.toggle('on', n === i));
    box.dispatchEvent(new CustomEvent('slide', {detail: i}));
  };
  box.onpointerdown = e => { if (e.target.closest('.ga')) return; drag = true; moved = false; x0 = e.clientX; dx = 0; tr.style.transition = 'none'; try { box.setPointerCapture(e.pointerId); } catch {} };
  box.onpointermove = e => { if (!drag) return; dx = e.clientX - x0; if (Math.abs(dx) > 6) moved = true; tr.style.transform = `translateX(calc(${-i * 100}% + ${dx}px))`; };
  box.onpointerup = box.onpointercancel = e => {
    if (!drag) return; drag = false;
    if (dx < -50) go(i + 1); else if (dx > 50) go(i - 1); else go(i);
    if (!moved && onTap && e.type === 'pointerup') onTap(i);
  };
  const L_ = box.querySelector('.ga.l'), R_ = box.querySelector('.ga.r');
  if (L_) { L_.onclick = () => go(i - 1); R_.onclick = () => go(i + 1); }
  go(i); return go;
}
function lightbox(imgs, i, sync) {
  const lb = document.createElement('div'); lb.className = 'lb';
  lb.innerHTML = '<button class="lx" type="button" aria-label="close">✕</button><div class="gal" dir="ltr"></div>';
  document.body.appendChild(lb);
  const box = lb.querySelector('.gal'); let cur = i;
  box.addEventListener('slide', e => cur = e.detail);
  const go = gallery(box, imgs, i, null, 1600);
  const key = e => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') go(cur + 1); else if (e.key === 'ArrowLeft') go(cur - 1); };
  const close = () => { lb.remove(); document.removeEventListener('keydown', key); sync(cur); };
  document.addEventListener('keydown', key);
  lb.querySelector('.lx').onclick = close; lb.onclick = e => { if (e.target === lb) close(); };
}

async function viewShop() {
  document.title = 'ABDmoteur';
  $('#app').innerHTML = `<section class="hero"><div><h1 class="word"><b>ABD</b><span>moteur</span></h1><p class="sub">${t('sub')}</p>
    <div class="find"><h2>${t('findcar')}</h2><select id="fb" aria-label="${t('brand')}"></select><select id="fm" aria-label="${t('model')}"></select>
    <input id="fq" type="search" placeholder="${t('search')}" value="${esc(q)}"><button class="btn alt" id="rs" style="grid-column:1/-1">${t('reset')}</button></div></div><div class="wheel" aria-hidden="true"></div></section>
    <div id="chips" class="chips"></div><p id="cnt" class="cnt"></p><div id="list" class="grid"></div>`;
  await loadProds(); ping();
  const brands = [...new Set(prods.flatMap(brandsOf))].sort();
  $('#fb').innerHTML = `<option value="">${t('allb')}</option>` + brands.map(b => `<option ${b === fb ? 'selected' : ''}>${esc(b)}</option>`).join('');
  const fillModels = () => {
    const ms = [...new Map(prods.flatMap(p => (p.compat || []).filter(c => c.brand === fb && c.model).map(c => [c.model.toLowerCase(), c.model]))).values()].sort();
    $('#fm').innerHTML = `<option value="">${t('allm')}</option>` + ms.map(m => `<option ${m === fm ? 'selected' : ''}>${esc(m)}</option>`).join('');
    $('#fm').disabled = !fb;
  };
  const match = p => (!cat || p.category === cat) && (!q || (p.name + ' ' + (p.description || '')).toLowerCase().includes(q.toLowerCase())) &&
    (!fb || p.universal || (p.compat || []).some(c => c.brand === fb && (!fm || !c.model || c.model.toLowerCase() === fm.toLowerCase())));
  const draw = () => {
    const cats = [...new Set(prods.map(p => p.category).filter(Boolean))];
    $('#chips').innerHTML = [''].concat(cats).map(c => `<button class="chip ${c === cat ? 'on' : ''}" data-c="${esc(c)}">${c ? esc(c) : t('all')}</button>`).join('');
    const list = prods.filter(match);
    $('#cnt').textContent = list.length + ' / ' + prods.length;
    $('#list').innerHTML = list.length ? list.map(p => `<article class="prod ${p.available === false ? 'off' : ''}"><a class="pic" href="/p/${esc(p.id)}">${imgsOf(p)[0] ? `<img loading="lazy" src="${esc(cdn(imgsOf(p)[0], 500))}" alt="${esc(p.name)}">` : '<div class="noimg"></div>'}${imgsOf(p).length > 1 ? `<span class="ph">🖼 ${imgsOf(p).length}</span>` : ''}</a>
      <div><div class="tags">${stockTag(p)}${tagsOf(p)}</div><a class="pname" href="/p/${esc(p.id)}">${esc(p.name)}</a><span class="price">${money(p.price)}</span><button class="btn" data-id="${esc(p.id)}" ${p.available === false ? 'disabled' : ''}>${p.available === false ? t('outstock') : t('add')}</button></div></article>`).join('')
      : `<p class="empty" style="grid-column:1/-1">${prods.length ? t('nores') : t('noprod')}</p>`;
  };
  fillModels(); draw();
  $('#fb').onchange = e => { fb = e.target.value; fm = ''; fillModels(); draw(); };
  $('#fm').onchange = e => { fm = e.target.value; draw(); };
  $('#fq').oninput = e => { q = e.target.value.trim(); draw(); };
  $('#rs').onclick = () => { fb = fm = q = cat = ''; viewShop(); };
  $('#chips').onclick = e => { if (e.target.dataset.c !== undefined) { cat = e.target.dataset.c; draw(); } };
  $('#list').onclick = e => { const id = e.target.dataset.id; if (id) { cart[id] = (cart[id] || 0) + 1; saveCart(); e.target.textContent = '✓'; setTimeout(() => e.target.textContent = t('add'), 700); } };
}

/* ---------- Product page (own link: /p/ID) ---------- */
async function viewProduct(id) {
  await loadProds(); ping();
  const p = prods.find(x => x.id === id);
  if (!p) { $('#app').innerHTML = `<div class="panel empty">${t('pnf')}<br><br><a class="btn" href="/">${t('back')}</a></div>`; return; }
  document.title = p.name + ' | ABDmoteur';
  const url = location.origin + '/p/' + p.id, imgs = imgsOf(p);
  const comp = (p.universal ? `<li>${t('univ')}</li>` : '') + (p.compat || []).map(c => `<li>${esc(c.brand)} ${c.model ? esc(c.model) : '(' + t('allm') + ')'}</li>`).join('');
  $('#app').innerHTML = `<p style="margin-bottom:14px"><a href="/">← ${t('back')}</a></p><div class="panel pp">
    <div>${imgs.length ? '<div class="gal" id="g" dir="ltr"></div><div class="thumbs" id="tn" dir="ltr"></div>' : '<div class="noimg"></div>'}</div>
    <div><h1>${esc(p.name)}</h1>${p.category ? `<span class="tag">${esc(p.category)}</span>` : ''} ${stockTag(p)}<span class="price"><em>${money(p.price)}</em></span>
    <h3>${t('compat')}</h3><ul>${comp}</ul>${p.description ? `<p style="margin-bottom:16px;line-height:1.7">${esc(p.description)}</p>` : ''}
    <button class="btn" id="ad" style="margin-bottom:18px" ${p.available === false ? 'disabled' : ''}>${p.available === false ? t('outstock') : t('add')}</button>
    <h3>${t('share')}</h3><div class="row" style="margin-top:8px">
      <a class="btn alt sm" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(p.name + ' ' + url)}">WhatsApp</a>
      <a class="btn alt sm" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}">Facebook</a>
      <button class="btn alt sm" id="cp">${t('copy')}</button></div></div></div>`;
  $('#ad').onclick = e => { cart[p.id] = (cart[p.id] || 0) + 1; saveCart(); e.target.textContent = '✓'; };
  if (imgs.length) {
    const g = $('#g'), tn = $('#tn');
    const go = gallery(g, imgs, 0, i => lightbox(imgs, i, go));
    if (imgs.length > 1) {
      tn.innerHTML = imgs.map((u, k) => `<img src="${esc(cdn(u, 160))}" alt="" data-k="${k}">`).join('');
      tn.onclick = e => { if (e.target.dataset.k) go(+e.target.dataset.k); };
      g.addEventListener('slide', e => tn.querySelectorAll('img').forEach((im, k) => im.classList.toggle('on', k === e.detail)));
      go(0);
    } else tn.remove();
  }
  $('#cp').onclick = async e => { try { await navigator.clipboard.writeText(url); e.target.textContent = t('copied'); } catch { prompt(t('copy'), url); } };
}

/* ---------- Cart + checkout ---------- */
async function viewCart() {
  await loadProds();
  let gone = false;
  Object.keys(cart).forEach(id => { const p = prods.find(x => x.id === id); if (p && p.available === false) { delete cart[id]; gone = true; } });
  if (gone) saveCart();
  const lines = Object.entries(cart).map(([id, n]) => ({p: prods.find(x => x.id === id), n})).filter(x => x.p);
  if (!lines.length) { $('#app').innerHTML = `<div class="panel empty">${flash || (gone ? t('unavail') : t('empty'))}<br><br><a class="btn" href="/">${t('back')}</a></div>`; flash = ''; return; }
  const sub = lines.reduce((a, l) => a + l.p.price * l.n, 0);
  $('#app').innerHTML = `<div class="panel" id="cl"><h2>${t('cart')}</h2>${gone ? `<p class="msg">${t('unavail')}</p>` : ''}${lines.map(l => `<div class="line"><span>${esc(l.p.name)}</span>
    <span class="row"><button class="btn alt sm" data-d="${esc(l.p.id)}:-1">−</button><b>${l.n}</b><button class="btn alt sm" data-d="${esc(l.p.id)}:1">+</button>
    <span>${money(l.p.price * l.n)}</span><button class="btn alt sm" data-d="${esc(l.p.id)}:x">${t('remove')}</button></span></div>`).join('')}</div>
  <form class="panel form" id="ck"><h2>${t('checkout')}</h2><div id="m"></div>
    <label>${t('name')}<input name="name" required maxlength="80" autocomplete="name"></label>
    <label>${t('phone')}<input name="phone" required type="tel" pattern="[0-9+\\s]{9,15}" autocomplete="tel"></label>
    <label>${t('wilaya')}<input name="wilaya" required maxlength="40"></label>
    <label>${t('address')}<input name="address" maxlength="160" autocomplete="street-address"></label>
    <label>${t('delivery')}<select name="delivery"><option value="home">${t('home')} — ${money(FEES.home)}</option><option value="desk">${t('desk')} — ${money(FEES.desk)}</option></select></label>
    <p>${t('sub_')}: <b>${money(sub)}</b></p><p>${t('total')}: <b id="tot"></b></p><button class="btn">${t('confirm')}</button></form>`;
  const tot = () => $('#tot').textContent = money(sub + FEES[$('#ck').elements.delivery.value]);
  tot(); $('#ck').elements.delivery.onchange = tot;
  $('#cl').onclick = e => {
    const d = e.target.dataset.d; if (!d) return; const [id, a] = d.split(':');
    if (a === 'x' || (cart[id] += +a) <= 0) delete cart[id]; saveCart(); viewCart();
  };
  $('#ck').onsubmit = async e => {
    e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    try {
      await jpost('/orders', {...f, items: Object.entries(cart).map(([id, qty]) => ({id, qty}))});
      cart = {}; saveCart(); flash = t('ok'); viewCart();
    } catch { $('#m').innerHTML = `<p class="msg">${t('err')}</p>`; }
  };
}

      <div class="row" style="flex-wrap:nowrap">
        <input type="password" id="pw" name="password" required autocomplete="current-password" style="flex:1">
        <button type="button" class="btn alt sm" id="eye" aria-label="${t('showpw')}" title="${t('showpw')}">👁</button>
      </div>
    </label>
    <button class="btn">${t('enter')}</button></form>`;
  $('#eye').onclick = () => { const i = $('#pw'); i.type = i.type === 'password' ? 'text' : 'password'; };
  $('#lg').onsubmit = async e => {
    e.preventDefault();
    try { const r = await jpost('/login', {password: $('#pw').value}); tok = r.token; sessionStorage.tok = tok; viewAdmin(); }
    catch { $('#m').innerHTML = `<p class="msg">${t('err')}</p>`; }
  };
}
function viewAdmin() {
  $('#app').innerHTML = `<div class="tabs">${['products', 'orders', 'stats'].map(k => `<button class="btn ${tab === k ? '' : 'alt'}" data-t="${k}">${t(k)}</button>`).join('')}
    <button class="btn alt" id="out">${t('logout')}</button></div><div id="tb"></div>`;
  document.querySelector('.tabs').onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; viewAdmin(); } };
  $('#out').onclick = () => { tok = ''; sessionStorage.tok = ''; location.hash = ''; };
  ({products: tabProducts, orders: tabOrders, stats: tabStats})[tab]();
}
let editId = '';
async function tabProducts() {
  const list = await api('/products'); prods = list;
  const ed = list.find(p => p.id === editId); if (!ed) editId = '';
  let compat = ed ? (ed.compat || []).map(c => ({...c})) : [];
  const cats = [...new Set(list.map(p => p.category).filter(Boolean))];
  const v = k => esc(ed ? ed[k] || '' : '');
  $('#tb').innerHTML = `<form class="panel form" id="pf"><h2>${editId ? t('edit') : t('addp')}</h2>
    <label>${t('pname')}<input name="name" required maxlength="100" value="${v('name')}"></label>
    <label>${t('price')}<input name="price" type="number" min="1" required value="${ed ? ed.price : ''}"></label>
    <label>${t('cat')}<input name="category" maxlength="40" list="cl" value="${v('category')}"><datalist id="cl">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></label>
    <label>${t('avail')}<select name="available"><option value="1">${t('instock')}</option><option value="0" ${ed && ed.available === false ? 'selected' : ''}>${t('outstock')}</option></select></label>
    <fieldset class="fs"><legend>${t('compat')}</legend>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="universal" style="width:auto" ${ed && ed.universal ? 'checked' : ''}> ${t('univhint')}</label>
      <div class="row"><input id="cb" list="bl" placeholder="${t('brand')}" maxlength="30" style="flex:1;min-width:130px"><datalist id="bl">${BRANDS.map(b => `<option value="${b}">`).join('')}</datalist>
        <input id="cmod" placeholder="${t('model')}" maxlength="40" style="flex:1;min-width:130px"><button type="button" class="btn alt sm" id="ca">${t('addc')}</button></div>
      <div id="cc" class="tags"></div></fieldset>
    <label>${t('desc')}<textarea name="description" rows="3" maxlength="600">${v('description')}</textarea></label>
    <div class="fs"><span style="color:var(--mut);font-size:14px">${t('imgs')} <b id="ic"></b></span><div id="ip" class="thumbsA"></div>
      <input id="fi" type="file" accept="image/*" multiple><small style="color:var(--mut)">${t('mainhint')}</small></div>
    <div class="row"><button class="btn">${editId ? t('upd') : t('save')}</button>${editId ? `<button type="button" class="btn alt" id="cx">${t('cancel')}</button>` : ''}</div></form>
    <div class="panel" id="pl">${list.map(p => `<div class="line"><span class="row">${imgsOf(p)[0] ? `<img src="${esc(cdn(imgsOf(p)[0], 100))}" width="46" height="46" style="object-fit:cover;border-radius:8px" alt="">` : ''}
      <span><b>${esc(p.name)}</b> — ${money(p.price)}<br><span class="tags">${tagsOf(p)}</span></span></span>
      <span class="row"><button class="st ${p.available === false ? 'out' : 'in'}" data-a="${esc(p.id)}:${p.available === false ? 1 : 0}">${p.available === false ? t('outstock') : t('instock')}</button>
      <a class="btn alt sm" target="_blank" href="/p/${esc(p.id)}">🔗</a><button class="btn alt sm" data-e="${esc(p.id)}">${t('edit')}</button><button class="btn alt sm" data-x="${esc(p.id)}">${t('del')}</button></span></div>`).join('') || `<p class="empty">${t('noprod')}</p>`}</div>`;
  const dc = () => $('#cc').innerHTML = compat.map((c, i) => `<span class="tag x" data-i="${i}">${esc(c.brand)} ${esc(c.model)} ✕</span>`).join('') || `<small style="color:var(--mut)">${t('nocompat')}</small>`;
  dc();
  const existing = ed ? imgsOf(ed).slice() : [], added = [];
  const dp = () => {
    $('#ip').innerHTML = existing.map((u, i) => `<div class="ath ${i === 0 ? 'main' : ''}"><img src="${esc(cdn(u, 160))}" alt="">${i > 0 ? `<button type="button" data-m="${i}" title="★">★</button>` : ''}<button type="button" data-rx="${i}">✕</button></div>`).join('') +
      added.map((f, i) => `<div class="ath ${!existing.length && i === 0 ? 'main' : ''}"><img src="${f.url}" alt=""><button type="button" data-nx="${i}">✕</button></div>`).join('');
    $('#ic').textContent = (existing.length + added.length) + '/6';
  };
  dp();
  $('#fi').onchange = async e => {
    for (const f of [...e.target.files]) {
      if (existing.length + added.length >= 6) { alert(t('max6')); break; }
      const blob = await shrink(f); if (blob) added.push({blob, url: URL.createObjectURL(blob)});
    }
    e.target.value = ''; dp();
  };
  $('#ip').onclick = e => {
    const d = e.target.dataset;
    if (d.m !== undefined) existing.unshift(...existing.splice(+d.m, 1));
    else if (d.rx !== undefined) existing.splice(+d.rx, 1);
    else if (d.nx !== undefined) added.splice(+d.nx, 1);
    else return;
    dp();
  };
  $('#ca').onclick = () => { const b = $('#cb').value.trim(); if (!b) return; compat.push({brand: b, model: $('#cmod').value.trim()}); $('#cb').value = ''; $('#cmod').value = ''; dc(); };
  $('#cc').onclick = e => { const i = e.target.dataset.i; if (i !== undefined) { compat.splice(+i, 1); dc(); } };
  if ($('#cx')) $('#cx').onclick = () => { editId = ''; tabProducts(); };
  $('#pf').onsubmit = async e => {
    e.preventDefault();
    const b = $('#cb').value.trim(); if (b) compat.push({brand: b, model: $('#cmod').value.trim()});
    const fd = new FormData(e.target);
    fd.set('universal', e.target.elements.universal.checked ? '1' : '0');
    if (fd.get('universal') !== '1' && !compat.length) return alert(t('brandreq'));
    fd.set('compat', JSON.stringify(compat));
    if (editId) fd.set('keep', JSON.stringify(existing));
    added.forEach((f, i) => fd.append('images', f.blob, 'photo' + i + '.jpg'));
    const sb = e.target.querySelector('button:not([type=button])'); sb.disabled = true;
    try { await api(editId ? '/products/' + editId : '/products', {method: editId ? 'PATCH' : 'POST', body: fd}); editId = ''; tabProducts(); }
    catch { sb.disabled = false; alert(t('err')); }
  };
  $('#pl').onclick = async e => {
    const d = e.target.dataset;
    if (d.x && confirm(t('del') + '?')) { await api('/products/' + d.x, {method: 'DELETE'}); tabProducts(); }
    else if (d.e) { editId = d.e; await tabProducts(); window.scrollTo(0, 0); }
    else if (d.a) { const [id, val] = d.a.split(':'); await jpost('/products/' + id, {available: val === '1'}, 'PATCH'); tabProducts(); }
  };
}
async function tabOrders() {
  const list = (await api('/orders')).sort((x, y) => y.createdAt - x.createdAt); // newest first
  const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };
  const todayK = dayKey(Date.now()), yestK = dayKey(Date.now() - 864e5), groups = [];
  list.forEach(o => {
    const k = dayKey(o.createdAt); let g = groups[groups.length - 1];
    if (!g || g.k !== k) { g = {k, ts: o.createdAt, items: []}; groups.push(g); }
    g.items.push(o);
  });
  const title = g => g.k === todayK ? t('today') : g.k === yestK ? t('yesterday')
    : new Date(g.ts).toLocaleDateString(lang, {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'});
  $('#tb').innerHTML = groups.map(g => `<h3 class="day">${esc(title(g))} <span>${g.items.length}</span></h3>` + g.items.map(o => `
    <div class="order ${o.reviewed ? 'done' : 'new'}">
      <div class="row"><span class="badge">${o.reviewed ? t('reviewed') : t('newo')}</span>
        <span>${new Date(o.createdAt).toLocaleTimeString(lang, {hour: '2-digit', minute: '2-digit'})}</span></div>
      <div><b>${esc(o.name)}</b> - ${esc(o.phone)}<br>${esc(o.wilaya)} ${esc(o.address)} (${t(o.delivery)})</div>
      <div>${o.items.map(i => esc(i.name) + ' x' + i.qty).join('<br>')}</div>
      <div><b>${money(o.total)}</b></div>
      <div class="row">
        <select style="width:auto" data-o="${esc(o.id)}">${['pending', 'shipped', 'delivered', 'cancelled'].map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${t(s)}</option>`).join('')}</select>
        <button class="btn sm ${o.reviewed ? 'alt' : 'ok'}" data-r="${esc(o.id)}:${o.reviewed ? 0 : 1}">${o.reviewed ? t('unrev') : t('markrev')}</button>
      </div></div>`).join('')).join('') || `<p class="empty">-</p>`;
  $('#tb').onchange = e => { if (e.target.dataset.o) jpost('/orders/' + e.target.dataset.o, {status: e.target.value}, 'PATCH'); };
  $('#tb').onclick = async e => {
    const r = e.target.dataset.r; if (!r) return; const [id, v] = r.split(':');
    await jpost('/orders/' + id, {reviewed: v === '1'}, 'PATCH'); tabOrders();
  };
}
async function tabStats() {
  const s = await api('/stats');
  const bars = o => { const m = Math.max(1, ...Object.values(o)); return `<div class="bars">${Object.entries(o).map(([k, v]) => `<div><span>${esc(k)}</span><i style="width:${v / m * 100}%"></i><b>${v}</b></div>`).join('') || '—'}</div>`; };
  const cards = [['revenue', money(s.revenue)], ['norders', s.orders], ['visits', s.visits], ['nprod', s.products], ['outstock', s.outofstock || 0], ['unreviewed', s.unreviewed || 0], ['pending', s.pending], ['shipped', s.shipped], ['delivered', s.delivered], ['cancelled', s.cancelled]];
  $('#tb').innerHTML = `<div class="cards">${cards.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${t(k)}</span></div>`).join('')}</div>
  <div class="panel"><h3>${t('byd')}</h3>${bars(s.byDay)}</div><div class="panel"><h3>${t('vbd')}</h3>${bars(s.visitsByDay)}</div>
  <div class="panel"><h3>${t('top')}</h3>${bars(s.top)}</div><div class="panel"><h3>${t('byw')}</h3>${bars(s.byWilaya)}</div>`;
}

setLang(lang);
</script>
